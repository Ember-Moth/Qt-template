name: Modules Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: '23.1.3'
  QT_VERSION: '6.12.0'
  # cmake/ImportStd.cmake enables `import std` with a gate UUID that only matches CMake 4.4.x.
  CMAKE_VERSION: '4.4.4'

jobs:
  build:
    name: ${{ matrix.preset }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026, macos-26]
        preset: [debug, debug-cxx26]
        include:
          # The Qt-free layers build and test on their own, also on Linux ARM64, which links
          # MMKV's ARMv8 AES assembly.
          - os: ubuntu-26.04
            preset: core
          - os: ubuntu-26.04-arm
            preset: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install CMake and Ninja
        run: python -m pip install "cmake==${{ env.CMAKE_VERSION }}" ninja
      # Clang everywhere, with the C++ library of each platform's Qt SDK.
      # Clang 21 from the Ubuntu archive rejects libstdc++'s std module mixed with headers.
      # libcurl comes from the system on Linux and macOS; Windows builds it from source.
      - name: Install LLVM, libcurl and Qt runtime dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "${LLVM_VERSION%%.*}"
          sudo apt-get install -y "clang-tools-${LLVM_VERSION%%.*}" libcurl4-openssl-dev libgl-dev libegl-dev libxkbcommon-dev libfontconfig1 libdbus-1-3
          echo "LLVM_ROOT=/usr/lib/llvm-${LLVM_VERSION%%.*}" >> "$GITHUB_ENV"
      # Linux and macOS use the system package managers; Windows extracts the 600 MB MSI once per version.
      - name: Cache LLVM on Windows
        if: runner.os == 'Windows'
        id: llvm-cache
        uses: actions/cache@v6
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-windows-x64
      - name: Install LLVM on Windows
        if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          curl.exe -fsSL -o llvm.msi "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi"
          Start-Process msiexec -Wait -ArgumentList '/a', "$PWD\llvm.msi", '/qn', 'TARGETDIR=C:\llvm'
      - name: Locate LLVM on Windows
        if: runner.os == 'Windows'
        run: |
          $clang = Get-ChildItem C:\llvm -Recurse -Filter clang.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          "LLVM_ROOT=$($clang.Directory.Parent.FullName -replace '\\', '/')" >> $env:GITHUB_ENV
      - name: Configure MSVC STL and Windows SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install LLVM on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LLVM_ROOT=$(brew --prefix llvm)" >> "$GITHUB_ENV"
      - name: Show tools
        shell: bash
        run: |
          cmake --version | head -1
          ninja --version
          "$LLVM_ROOT/bin/clang" --version | head -1
      - name: Install Qt
        if: matrix.preset != 'core'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          setup-python: false
          # aqtinstall 3.3.0 cannot read the per-kit Windows repository layout of Qt 6.12.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Lint QML
        if: matrix.preset != 'core'
        run: cmake --build --preset ${{ matrix.preset }} --target lint
      # cmake --install runs Qt's deployment script: macdeployqt, windeployqt or the Linux deployment.
      - name: Install with Qt deployment
        if: matrix.preset == 'debug'
        shell: bash
        run: |
          cmake --install build/debug --prefix install
          find install \( -name qt_template -o -name qt_template.exe \) -type f | grep .
          find install \( -name 'Qt6Core*.dll' -o -name QtCore.framework -o -name 'libQt6Core.so*' \) | grep .
          find install -type d -path '*/QtQuick/Controls' | grep .
