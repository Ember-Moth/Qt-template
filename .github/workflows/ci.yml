name: Modules Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: '23.1.3'
  QT_VERSION: '6.12.0'

jobs:
  build:
    name: C++${{ matrix.standard }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026, macos-26]
        standard: [23, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      # Clang everywhere, with the C++ library of each platform's Qt SDK.
      # Clang 21 from the Ubuntu archive rejects libstdc++'s std module mixed with headers.
      - name: Install LLVM and Qt runtime dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "${LLVM_VERSION%%.*}"
          sudo apt-get install -y "clang-tools-${LLVM_VERSION%%.*}" libgl-dev libegl-dev libxkbcommon-dev libfontconfig1 libdbus-1-3
          echo "LLVM_ROOT=/usr/lib/llvm-${LLVM_VERSION%%.*}" >> "$GITHUB_ENV"
      - name: Install LLVM on Windows
        if: runner.os == 'Windows'
        run: |
          curl.exe -fsSL -o llvm.msi "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi"
          Start-Process msiexec -Wait -ArgumentList '/a', "$PWD\llvm.msi", '/qn', 'TARGETDIR=C:\llvm'
          $clang = Get-ChildItem C:\llvm -Recurse -Filter clang.exe | Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          "LLVM_ROOT=$($clang.Directory.Parent.FullName -replace '\\', '/')" >> $env:GITHUB_ENV
      - name: Configure MSVC STL and Windows SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install LLVM on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LLVM_ROOT=$(brew --prefix llvm)" >> "$GITHUB_ENV"
      - name: Show Clang
        shell: bash
        run: '"$LLVM_ROOT/bin/clang" --version'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
          setup-python: false
      - name: Configure
        run: xmake f -y -m debug --toolchain=llvm --sdk="${{ env.LLVM_ROOT }}" --qt="${{ env.QT_ROOT_DIR }}" --cxxstd=${{ matrix.standard }}
      - name: Build
        run: xmake build -j 2
      - name: Test
        run: xmake test -v
      - name: Lint QML
        run: xmake lint
