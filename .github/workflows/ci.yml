name: Modules Desktop CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: C++${{ matrix.standard }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2022, macos-26]
        standard: [23, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.1'
      # Clang everywhere, with the C++ library of each platform's Qt SDK.
      - name: Install LLVM and Qt runtime dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tools lld llvm libgl-dev libegl-dev libxkbcommon-dev libfontconfig1 libdbus-1-3
          echo "LLVM_ROOT=$(dirname "$(dirname "$(readlink -f "$(command -v clang)")")")" >> "$GITHUB_ENV"
      - name: Use preinstalled LLVM on Windows
        if: runner.os == 'Windows'
        run: echo "LLVM_ROOT=C:/Program Files/LLVM" >> $env:GITHUB_ENV
      - name: Configure MSVC STL and Windows SDK environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install LLVM on macOS
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "LLVM_ROOT=$(brew --prefix llvm)" >> "$GITHUB_ENV"
      - name: Show Clang
        shell: bash
        run: '"$LLVM_ROOT/bin/clang" --version'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
          setup-python: false
      - name: Configure
        run: xmake f -y -m debug --toolchain=llvm --sdk="${{ env.LLVM_ROOT }}" --qt="${{ env.QT_ROOT_DIR }}" --cxxstd=${{ matrix.standard }}
      - name: Build
        run: xmake build -j 2
      - name: Test
        run: xmake test -v
      - name: Lint QML
        run: xmake lint
